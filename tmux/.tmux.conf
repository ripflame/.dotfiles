# Modern tmux configuration with Nerdfonts

# Enable 256 colors
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",*256col*:Tc"

# Change prefix key to Ctrl+a
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Change kill pane without asking
bind-key X kill-pane
# Change kill pane asking
bind-key x confirm-before kill-pane

# Start window numbering at 1
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on

# Status bar styling
set -g status-position top
set -g status-style bg=default,fg=blue
set -g status-left-length 50
set -g status-right-length 100

# Modern status bar with Nerdfonts
set -g status-left "#[fg=cyan,bold] #[fg=blue,bold]#S #[fg=blue,nobold]"
set -g status-right "#{?client_prefix,#[reverse] ⌨ PREFIX #[noreverse] ,}#{?window_zoomed_flag,#[reverse] \uf002 ZOOMED #[noreverse] ,}#[fg=cyan] %H:%M #[fg=blue] %d-%b "

# Window status format
setw -g window-status-format "#[fg=brightblack] #I #[fg=brightblack]#W "
setw -g window-status-current-format "#[fg=cyan,bold] #I #[fg=blue,bold]#W "

# Active window styling
setw -g window-status-current-style fg=blue,bg=default
setw -g window-status-style fg=brightblack,bg=default

# Pane border styling
set -g pane-border-style fg=brightblack
set -g pane-active-border-style fg=cyan

# Configure mouse support
set -g mouse on

# Reduce escape time for faster response in Vim/Neovim
set -sg escape-time 10

# Set larger history limit
set -g history-limit 10000

# Use vim keybindings in copy mode
setw -g mode-keys vi

# Vim-style pane navigation
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Vim-style pane resizing
bind H resize-pane -L 10
bind J resize-pane -D 10
bind K resize-pane -U 10
bind L resize-pane -R 10

# Enable clipboard integration
set -g set-clipboard on

# Allow escape sequence passthrough (active pane only) for notifications and images
set -g allow-passthrough on
set -g focus-events on

# Intuitive window splitting keys
bind-key | split-window -h -c "#{pane_current_path}"
bind-key - split-window -v -c "#{pane_current_path}"

# Create new window in current directory
bind c new-window -c "#{pane_current_path}"

# Easy reloading of config
bind r source-file ~/.tmux.conf \; display "Config reloaded!"

# Plugin Manager (TPM)
set -g @plugin 'tmux-plugins/tpm'

# Session persistence
set -g @plugin 'tmux-plugins/tmux-resurrect'

# Initialize TPM (keep at the very bottom)
run '~/.tmux/plugins/tpm/tpm'
